<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier — Handmade Art</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">Atelier</a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Gallery</a></li>
	  <li><a href="classes.html">Classes</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="nav-toggle" aria-label="menu">&#9776;</button>
  </nav>

  <!-- HERO -->
  <header class="hero">
    <div class="hero-text">
      <span class="hero-eyebrow">Handmade with intention</span>
      <h1>Each piece<br/><em>tells a story</em></h1>
      <p>Original art — crafted by hand, one at a time.</p>
    </div>
    <div class="hero-tape hero-tape--1"></div>
    <div class="hero-tape hero-tape--2"></div>
  </header>

  <!-- FILTER BAR -->
  <section class="filter-bar">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="painting">Painting</button>
    <button class="filter-btn" data-filter="textile">Textile</button>
    <button class="filter-btn" data-filter="sculpture">Sculpture</button>
    <button class="filter-btn" data-filter="mixed">Mixed Media</button>
  </section>

  <!-- GALLERY GRID — populated dynamically from articles/manifest.json -->
  <main class="gallery" id="gallery">
    <p class="gallery-loading">Loading gallery…</p>
  </main>

  <!-- LIGHTBOX MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closePiece(event)">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="closePiece()">&#x2715;</button>
      <div class="modal-media-wrap">
        <div class="modal-media" id="modalMedia"></div>
        <button class="modal-nav modal-prev" id="modalPrev" aria-label="Previous image">&#x2039;</button>
        <button class="modal-nav modal-next" id="modalNext" aria-label="Next image">&#x203A;</button>
      </div>
      <div class="modal-body">
        <div class="modal-header">
          <div>
            <h2 id="modalTitle"></h2>
            <p id="modalMedium" class="modal-medium"></p>
          </div>
          <div class="modal-price-wrap">
            <span id="modalPrice" class="modal-price"></span>
            <a href="contact.html" class="modal-buy-btn">Enquire to Buy</a>
          </div>
        </div>
        <p id="modalDesc" class="modal-desc"></p>
        <div class="modal-thumbs" id="modalThumbs"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Atelier · All pieces are one-of-a-kind originals</p>
    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html">Admin</a>
    </div>
  </footer>

  <script src="js/gallery.js"></script>
</body>
</html>
